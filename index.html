<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2b2b2b;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #title {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 4rem;
      background: linear-gradient(90deg, #4da6ff, #1e90ff, #4da6ff);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 8px rgba(77, 166, 255, 0.6);
      margin-bottom: 3rem;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #button-container {
      display: flex;
      gap: 40px;
      z-index: 10;
    }
    button {
      background: #4da6ff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      min-width: 220px;
    }
    button:hover {
      background: #3a8dde;
    }
    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Stylish Password Screen */
    #passwordScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #1a1a1a, #2b2b2b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      font-family: 'Poppins', sans-serif;
      animation: fadeIn 0.5s ease-out;
    }
    #passwordScreen h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #4da6ff, #1e90ff, #4da6ff);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #passwordScreen input {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      background: #222;
      color: white;
      box-shadow: 0 0 10px rgba(77,166,255,0.2);
      outline: none;
    }
    #passwordScreen button {
      margin-top: 12px;
      padding: 10px 20px;
      font-size: 16px;
      background: #4da6ff;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(77,166,255,0.3);
      transition: background 0.3s ease, transform 0.2s ease;
    }
    #passwordScreen button:hover {
      background: #3a8dde;
      transform: scale(1.05);
    }
    #passwordScreen #error {
      color: #ff4d4d;
      margin-top: 12px;
      font-weight: 500;
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="passwordScreen">
  <h2>Enter Password</h2>
  <input type="password" id="passwordInput" placeholder="Password" />
  <button onclick="checkPassword()">Enter</button>
  <p id="error">Incorrect password</p>
</div>

<div id="realContent" style="display:none; flex-direction: column; align-items: center; justify-content: center;">

  <div id="tsparticles"></div>

  <div id="title">Classroom Hub (beta)</div>

  <div id="button-container">
    <button id="bypass-button">GoGuardian Fix</button>
    <button id="continue-button">No GoGuardian Fix</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <script>
    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      fpsLimit: 60,
      particles: {
        color: { value: "#4da6ff" },
        links: {
          color: "#4da6ff",
          distance: 120,
          enable: true,
          opacity: 0.2,
          width: 1
        },
        collisions: { enable: false },
        move: {
          directions: "none",
          enable: true,
          outModes: { default: "bounce" },
          random: false,
          speed: 1,
          straight: false
        },
        number: { density: { enable: true, area: 800 }, value: 40 },
        opacity: { value: 0.3 },
        shape: { type: "circle" },
        size: { value: { min: 1, max: 4 } }
      },
      detectRetina: true
    });
  </script>

  <script>
    const bypassBtn = document.getElementById('bypass-button');
    const continueBtn = document.getElementById('continue-button');

    bypassBtn.addEventListener('click', () => {
      const newTab = window.open('about:blank');
      if (!newTab) {
        alert("Pop-up blocked! Please allow pop-ups for this site.");
        return;
      }

      window.location.href = 'https://classroom.google.com';

      const code = `
        document.title = "Home";
        const style = document.createElement('style');
        style.textContent = \`
          body {
            margin: 0;
            background: #121212;
            overflow: hidden;
          }
          iframe {
            width: 100vw;
            height: 100vh;
            border: none;
          }
          #toolbar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: opacity 0.2s ease;
          }
          #toolbar button {
            background: #4da6ff;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            transition: background 0.2s ease;
          }
          #toolbar button:hover {
            background: #3a8dde;
          }
        \`;
        document.head.appendChild(style);

        const iframe = document.createElement('iframe');
        iframe.src = 'site.html';
        document.body.appendChild(iframe);

        const toolbar = document.createElement('div');
        toolbar.id = 'toolbar';

        const homeBtn = document.createElement('button');
        homeBtn.textContent = '🏠 Go Home';
        homeBtn.onclick = () => {
          iframe.src = iframe.src;
        };

        toolbar.appendChild(homeBtn);
        document.body.appendChild(toolbar);
      `;

      const script = newTab.document.createElement('script');
      script.textContent = code;
      newTab.document.body.innerHTML = '';
      newTab.document.body.appendChild(script);
    });

    continueBtn.addEventListener('click', () => {
      window.location.href = 'site.html';
    });
  </script>
</div>

<script>
  function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    if (input === "magpie") {
      document.getElementById("passwordScreen").style.display = "none";
      document.getElementById("realContent").style.display = "flex";
    } else {
      document.getElementById("error").style.display = "block";
    }
  }

  document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
  });
</script>

</body>
</html>
