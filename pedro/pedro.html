<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Friend Pedro - Fullscreen with Border</title>
  <script src="../ruffle/ruffle.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }

    #game-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 95%;
      height: 95%;
      border: 8px solid #fff;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    ruffle-embed, canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>
  </div>

  <script>
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById("game-container").appendChild(player);

    ruffle.log_level = "debug";

    player.load("my-friend-pedro-1598012ef.swf");

    player.addEventListener("error", (e) => {
      console.error("Ruffle error:", e.message);
    });
  </script>
</body>
</html>
