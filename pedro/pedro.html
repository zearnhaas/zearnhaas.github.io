<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Friend Pedro - Fullscreen</title>
  <!-- Ruffle JS from root /ruffle/ folder -->
  <script src="../ruffle/ruffle.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    ruffle-embed, canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // Create Ruffle player manually
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    // Append player to container
    document.getElementById("game-container").appendChild(player);

    // Enable debug logging (optional)
    ruffle.log_level = "debug";

    // Load the SWF from the same folder as this HTML
    player.load("my-friend-pedro-1598012ef.swf");

    // Catch errors
    player.addEventListener("error", (e) => {
      console.error("Ruffle error:", e.message);
    });
  </script>
</body>
</html>
