<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zearn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: #2b2b2b;
    color: #e0e0e0;
    position: relative;
  }
  header {
    background-color: #3a3a3a;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 10;
  }
  .search-container {
    position: relative;
  }
  .search-input {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    background: #2b2b2b;
    color: #fff;
    outline: none;
    box-shadow: 0 0 4px rgba(77, 166, 255, 0.3);
    width: 180px;
  }
  .search-results {
    position: absolute;
    top: 110%;
    left: 0;
    background: #333;
    border-radius: 6px;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    max-height: 300px;
    overflow-y: auto;
    z-index: 999;
    width: 240px;
    display: none;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.5rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .search-result:hover {
    background: #444;
  }
  .search-result img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 4px;
  }
  .search-result span {
    font-size: 0.95rem;
    color: #fff;
  }
  h1 {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    background: linear-gradient(90deg, #4da6ff, #1e90ff, #4da6ff);
    background-size: 200% 200%;
    animation: gradientShift 3s ease infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 8px rgba(77, 166, 255, 0.6);
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  main {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
    position: relative;
    z-index: 10;
  }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
  }
  a.game-link {
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .game-card {
    background: #404040;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.2);
    text-align: center;
    user-select: none;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    height: 300px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
  }
  .game-image {
    flex-grow: 1;
    overflow: hidden;
  }
  .game-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }
  .game-name {
    font-weight: 600;
    color: #ffffff;
    background: #333;
    padding: 0.5rem;
    font-size: 1rem;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }
  footer {
    text-align: center;
    padding: 2rem 1rem;
    color: #ccc;
    font-size: 0.9rem;
    position: relative;
    z-index: 10;
  }
  @media (max-width: 600px) {
    .games-grid {
      grid-template-columns: repeat(1, 1fr);
    }
  }
  #tsparticles {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="tsparticles"></div>

<header>
  <div class="search-container">
    <input type="text" class="search-input" id="search" placeholder="Search games...">
    <div class="search-results" id="results"></div>
  </div>
  <h1>billybobgames v2</h1>
</header>

<main>
  <div class="games-grid" id="gameGrid">

    <!-- All Games -->
    <a href="https://zearnhaas.github.io/bitlife/" class="game-link" data-name="Bitlife" data-img="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/bitlife.jpeg">
      <div class="game-card">
        <div class="game-image"><img src="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/bitlife.jpeg" alt="Bitlife" /></div>
        <div class="game-name">Bitlife</div>
      </div>
    </a>

    <a href="https://zearnhaas.github.io/blockblast/" class="game-link" data-name="Block Blast" data-img="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/blockblast.jpeg">
      <div class="game-card">
        <div class="game-image"><img src="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/blockblast.jpeg" alt="Block Blast" /></div>
        <div class="game-name">Block Blast</div>
      </div>
    </a>

    <a href="https://zearnhaas.github.io/cluster-main/" class="game-link" data-name="Cluster Rush" data-img="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/clusterrush.jpeg">
      <div class="game-card">
        <div class="game-image"><img src="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/clusterrush.jpeg" alt="Cluster Rush" /></div>
        <div class="game-name">Cluster Rush</div>
      </div>
    </a>

    <a href="https://zearnhaas.github.io/drivemad/" class="game-link" data-name="Drive Mad" data-img="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/drivemad.png">
      <div class="game-card">
        <div class="game-image"><img src="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/drivemad.png" alt="Drive Mad" /></div>
        <div class="game-name">Drive Mad</div>
      </div>
    </a>

    <a href="https://zearnhaas.github.io/flappybird/" class="game-link" data-name="Flappy Bird" data-img="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/flappybird.jpeg">
      <div class="game-card">
        <div class="game-image"><img src="https://raw.githubusercontent.com/zearnhaas/zearnhaas.github.io/main/siteimages/gamelogos/flappybird.jpeg" alt="Flappy Bird" /></div>
        <div class="game-name">Flappy Bird</div>
      </div>
    </a>

    <!-- Add all other games here with data-name and data-img for search -->

  </div>
</main>

<footer>
  Made with &lt;3 by averageperson4. I don't own any of these games. This site is maintained especially for HAAS network restrictions.<br />
  <a href="https://docs.google.com/forms/d/1xE5A3uYYN02mKgWIO0--GJwjwLFjWhrm-p0ewwLbSYk/" target="_blank" rel="noopener" style="color: #4da6ff; text-decoration: underline;">
    Request a Game/Feedback
  </a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script>
  tsParticles.load("tsparticles", {
    fullScreen: { enable: false },
    fpsLimit: 60,
    interactivity: {
      events: {
        onHover: { enable: true, mode: "repulse" },
        resize: true
      },
      modes: {
        repulse: { distance: 100, duration: 0.4 }
      }
    },
    particles: {
      color: { value: "#4da6ff" },
      links: {
        color: "#4da6ff",
        distance: 120,
        enable: true,
        opacity: 0.2,
        width: 1
      },
      move: {
        enable: true,
        speed: 1,
        outModes: { default: "bounce" }
      },
      number: { density: { enable: true, area: 800 }, value: 40 },
      opacity: { value: 0.3 },
      shape: { type: "circle" },
      size: { value: { min: 1, max: 4 } }
    },
    detectRetina: true
  });

  const searchInput = document.getElementById("search");
  const resultsDiv = document.getElementById("results");
  const gameLinks = Array.from(document.querySelectorAll(".game-link"));

  searchInput.addEventListener("input", () => {
    const val = searchInput.value.toLowerCase();
    resultsDiv.innerHTML = "";
    if (!val) {
      resultsDiv.style.display = "none";
      gameLinks.forEach(link => link.style.display = "block");
      return;
    }

    const matched = [];
    gameLinks.forEach(link => {
      const name = link.dataset.name.toLowerCase();
      if (name.includes(val)) {
        link.style.display = "block";
        matched.push(link);
      } else {
        link.style.display = "none";
      }
    });

    if (matched.length > 0) {
      matched.slice(0, 6).forEach(link => {
        const result = document.createElement("div");
        result.className = "search-result";
        result.innerHTML = `
          <img src="${link.dataset.img}" alt="${link.dataset.name}">
          <span>${link.dataset.name}</span>
        `;
        result.onclick = () => window.location.href = link.href;
        resultsDiv.appendChild(result);
      });
      resultsDiv.style.display = "block";
    } else {
      resultsDiv.style.display = "none";
    }
  });

  document.addEventListener("click", e => {
    if (!resultsDiv.contains(e.target) && e.target !== searchInput) {
      resultsDiv.style.display = "none";
    }
  });
</script>

</body>
</html>
